# Local development — all infrastructure runs in Docker
# Usage: docker compose -f deploy/docker-compose.local.yml up -d

services:

  # ---- Infrastructure ----

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/local-init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic application-events --partitions 3 --replication-factor 1 &&
       kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic consent-events --partitions 3 --replication-factor 1 &&
       kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic pricing-events --partitions 3 --replication-factor 1 &&
       kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic offer-acceptance-events --partitions 3 --replication-factor 1 &&
       kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic document-events --partitions 3 --replication-factor 1 &&
       echo 'Topics created.'"

  wiremock:
    image: wiremock/wiremock:3.9.1
    ports:
      - "9090:8080"
    volumes:
      - ../wiremock/mappings:/home/wiremock/mappings:ro
    command: ["--verbose"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/__admin/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Backend Services ----

  application-management-service:
    image: ${DOCKER_USERNAME}/application-management-service:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: application-management-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: mock
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/app_management
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: local-dev-secret-change-in-production
      BOLT_API_KEY: mock-key
      BOLT_URL: http://wiremock:8080
      OFFER_MANAGEMENT_URL: http://wiremock:8080
      CUSTOMER_PROFILE_URL: http://wiremock:8080
      SSN_VERIFICATION_URL: http://wiremock:8080
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    restart: unless-stopped

  pricing-orchestration-service:
    image: ${DOCKER_USERNAME}/pricing-orchestration-service:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: pricing-orchestration-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: mock
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/pricing_orchestration
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CREDIT_MANAGEMENT_URL: http://wiremock:8080
      DECISION_PLATFORM_URL: http://wiremock:8080
      APPLICATION_MANAGEMENT_URL: http://application-management-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    restart: unless-stopped

  document-service:
    image: ${DOCKER_USERNAME}/document-service:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: document-service
    ports:
      - "8084:8084"
    environment:
      DOCUMENT_DB_URL: jdbc:postgresql://postgres:5432/document_service
      DOCUMENT_DB_USER: postgres
      DOCUMENT_DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APPLICATION_MANAGEMENT_URL: http://application-management-service:8081
      JWT_SECRET: local-dev-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  offer-acceptance-service:
    image: ${DOCKER_USERNAME}/offer-acceptance-service:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: offer-acceptance-service
    ports:
      - "8085:8085"
    environment:
      OFFER_ACCEPTANCE_DB_URL: jdbc:postgresql://postgres:5432/offer_acceptance
      OFFER_ACCEPTANCE_DB_USER: postgres
      OFFER_ACCEPTANCE_DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: local-dev-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  zookeeper-data:
