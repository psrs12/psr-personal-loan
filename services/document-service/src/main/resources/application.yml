server:
  port: 8084

spring:
  application:
    name: document-service
  datasource:
    url: ${DOCUMENT_DB_URL:jdbc:postgresql://localhost:5432/document_service}
    username: ${DOCUMENT_DB_USER:postgres}
    password: ${DOCUMENT_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: document-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.personalloan.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

kafka:
  topics:
    pricing-events: pricing-events
    document-events: document-events

services:
  application-management:
    base-url: ${APPLICATION_MANAGEMENT_URL:http://localhost:8081}

jwt:
  secret: ${JWT_SECRET:dev-secret-change-in-production}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
